version: "2"  # Required for v2

run:
  timeout: 5m

linters:
  default: none  # Replaces 'disable-all: true'
  enable:
    - errcheck     # Checks for unchecked errors
    - staticcheck  # Now includes gosimple and stylecheck checks
    - unused       # Checks for unused constants/variables
    - govet        # Examines code for suspicious constructs
    - revive       # Modern replacement for golint

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprint
      - fmt.Fprintln
